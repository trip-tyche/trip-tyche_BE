auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # 보관 기간보다 오래된 로그를 밀어 넣으면 compactor가 곧바로 지우므로 입구에서 거절한다.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true

# retention은 compactor가 실행한다. retention_enabled가 꺼져 있으면 retention_period가 무시된다.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
