apiVersion: 1

# 이전 프로비저닝의 discord 수신처를 지운다. 남겨 두면 Grafana DB에 계속 남는다.
deleteContactPoints:
  - orgId: 1
    uid: discord-webhook

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-bot
        type: telegram
        settings:
          # 값은 VM .env에서 온다. 비어 있으면 compose의 더미값이 들어가 프로비저닝은 성공하고 전송만 실패한다.
          bottoken: ${TELEGRAM_BOT_TOKEN}
          chatid: ${TELEGRAM_CHAT_ID}
          parse_mode: HTML
          message: '{{ template "tt.message" . }}'
          disable_notification: false
