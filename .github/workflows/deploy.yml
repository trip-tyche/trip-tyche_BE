name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: chmod +x gradlew && ./gradlew bootJar --no-daemon -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: maristadev/triptyche-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml,database,image-worker,nginx/nginx.conf"
          target: "~/triptyche/"

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # set -e가 없으면 중간 실패를 마지막 명령의 종료 코드가 덮어, 서비스가 죽은 채로
            # 배포가 success로 표시된다. 실제로 flyway 실패 → app 미기동 → 502를 놓쳤다.
            set -euo pipefail

            cd ~/triptyche
            docker compose pull app
            docker compose build image-worker

            # --wait은 실패해도 컨테이너 로그를 남기지 않는다. 원인을 알 수 없으면 복구가 늦어지므로
            # 실패 시 상태와 로그를 함께 남기고 명시적으로 실패시킨다.
            if ! docker compose up -d --wait; then
                echo "::error::컨테이너 기동 실패"
                docker compose ps || true
                echo "----- flyway -----"
                docker compose logs --tail=120 flyway || true
                echo "----- app -----"
                docker compose logs --tail=60 app || true
                exit 1
            fi

            # nginx.conf는 단일 파일 바인드 마운트라 scp로 교체되면 inode가 바뀐다.
            # 컨테이너는 삭제된 옛 inode를 계속 보므로 reload만으로는 반영되지 않는다.
            docker compose up -d --force-recreate nginx
            docker compose exec -T nginx nginx -t
            docker image prune -f

