# 인증·디바이스 등록 경로만 rate limit 대상으로 뽑는다.
# 키가 빈 문자열이면 nginx는 그 요청에 제한을 적용하지 않는다.
# location을 쪼개면 proxy_set_header 8줄을 복제해야 하므로 map으로 갈라낸다.
#
# $uri는 정규화된 경로다. $request_uri(원문)를 쓰면 //v1/auth/... 같은 변형으로 우회된다.
map $uri $rate_limited_client {
    default            "";
    ~^/v1/auth/token/  $binary_remote_addr;
    ~^/v1/devices      $binary_remote_addr;
}

# 1r/s. 1회용 code는 32바이트 난수 + TTL 60초라 무차별 대입이 사실상 불가능하므로
# 목적은 "뚫기 방지"가 아니라 "비정상 트래픽이 톰캣 스레드를 먹는 것 방지"다.
# 국내 모바일 캐리어는 CGNAT로 다수 사용자가 한 IP를 공유하니 과하게 조이지 않는다.
limit_req_zone $rate_limited_client zone=auth_zone:10m rate=60r/m;
limit_req_status 429;
limit_req_log_level warn;

# rt와 urt(upstream 응답 시간)의 차이가 크면 병목은 앱이 아니라 네트워크/클라이언트다.
# log_format은 http 컨텍스트 전용이다. 이 파일은 conf.d/default.conf로 http 안에 include된다.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for" '
                 'rt=$request_time urt=$upstream_response_time';

# 80과 443을 한 블록에서 받는다.
# Cloudflare가 오리진에 HTTP(80)로 붙는 구성이라, 80에서 301 리다이렉트를 돌려주면
# CF가 그 301을 클라이언트에 그대로 전달해 무한 리다이렉트가 된다.
# 클라이언트 HTTPS 강제는 Cloudflare의 Always Use HTTPS가 담당한다.
server {
    listen 80;
    listen 443 ssl;
    server_name api.triptyche.cloud;

    # server 레벨에서 지정해야 http 레벨의 기본 access_log(main)를 대체한다.
    # http 레벨에 또 선언하면 두 로그가 함께 남아 한 요청이 두 줄로 기록된다.
    access_log /var/log/nginx/access.log timed;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cloudflare 실제 IP 복원
    # realip 모듈은 POST_READ 단계에서 동작하고 limit_req는 PREACCESS 단계라,
    # $binary_remote_addr는 이 시점에 이미 실제 클라이언트 IP다.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=10s;

    # actuator는 8081로 분리됐지만, 설정 실수로 8080에 다시 열려도 외부로 나가지 않게 이중으로 막는다.
    location /actuator {
        return 404;
    }

    # Spring Boot API
    location / {
        # map이 빈 키를 준 경로(대부분의 API)는 이 지시어의 영향을 받지 않는다.
        limit_req zone=auth_zone burst=20 nodelay;

        set $upstream http://app:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # WebSocket — 핸드셰이크는 제한 대상이 아니다 (map에서 빈 키)
    location /ws {
        set $upstream http://app:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
