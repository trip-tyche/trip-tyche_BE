spring:
  profiles:
    group:
      local: local
      prod: prod

jwt:
  access-token-expiry-seconds: 3600       # 1시간
  refresh-token-expiry-seconds: 2592000   # 30일
  guest-token-expiry-seconds: 14400       # 4시간

# SecurityConfig(REST)와 WebSocketConfig(STOMP)가 함께 읽는다.
cors:
  allowed-origins:
    - https://triptyche.cloud
    - https://www.triptyche.cloud
    - http://localhost:3000
    - https://localhost          # Capacitor 앱 WebView

# 앱 딥링크 허용 목록. 여기 없는 redirect_uri는 앱 분기를 타지 못한다.
app-auth:
  allowed-redirects:
    - triptyche://auth/callback

# 값을 바꿀 때 이미지 재빌드가 필요하지 않도록 환경변수로 덮어쓸 수 있게 둔다.
# 치명적 버그로 구버전을 급히 막아야 할 때 배포 파이프라인 전체를 타면 늦는다.
# ⚠️ update-url은 실제로 APK를 내려받을 수 있는 주소여야 한다.
#    현재 기본값은 자리표시자다 — 배포 경로가 정해지면 VM의 .env에서 APP_UPDATE_URL로 지정할 것.
app:
  min-supported-version: ${APP_MIN_SUPPORTED_VERSION:1.0.0}
  latest-version: ${APP_LATEST_VERSION:1.0.0}
  update-url: ${APP_UPDATE_URL:https://triptyche.cloud}
  # 최신 버전은 APK를 올린 배포 파이프라인이 함께 발행하는 매니페스트에서 읽는다.
  # 사람이 손으로 맞추면 반드시 어긋나므로(실제로 서버 1.0.0 / 배포 1.0.1로 벌어졌다) 자동화한다.
  # 비워 두면 위 latest-version 설정값을 그대로 쓴다.
  version-manifest-url: ${APP_VERSION_MANIFEST_URL:https://axzfydlzvxoh.compat.objectstorage.ap-chuncheon-1.oraclecloud.com/triptyche-storage/app/version.json}

logging:
  pattern:
    level: "%5p [%X{client:-unknown} %X{appVersion:-unknown}]"

triptyche:
  guest:
    template-email: "guest_template@triptyche.com"
    share-target-trip-title: "뉴욕 가을 여행"

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/trip_tyche
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/signin/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/signin/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  cloud:
    aws:
      s3:
        bucketName: triptyche-storage
        endpoint: ${OCI_S3_ENDPOINT}
      credentials:
        accessKey: ${OCI_ACCESS_KEY}
        secretKey: ${OCI_SECRET_KEY}
      region:
        static: ap-chuncheon-1

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  redirect:
    url: http://localhost:8080/swagger-ui/index.html
    failure-url: http://localhost:8080/swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true

springdoc:
  swagger-ui:
    operationsSorter: method

trip:
  soft-delete:
    retention-days: 30

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate:
      sql: debug
      type:
        descriptor:
          sql:
            BasicBinder: trace

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # flyway와 같은 이유로 필요하다 — 아래 주석 참조(docker-compose.yml의 flyway 서비스).
    url: jdbc:mysql://db:3306/trip_tyche?allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: redis
      port: 6379
      password: ${SPRING_REDIS_PASSWORD}
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            redirect-uri: "${KAKAO_REDIRECT_URI}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            redirect-uri: "${GOOGLE_REDIRECT_URI}"
            authorization-grant-type: authorization_code
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  cloud:
    aws:
      s3:
        bucketName: triptyche-storage
        endpoint: ${OCI_S3_ENDPOINT}
      credentials:
        accessKey: ${OCI_ACCESS_KEY}
        secretKey: ${OCI_SECRET_KEY}
      region:
        static: ap-chuncheon-1

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  redirect:
    url: https://triptyche.cloud
    failure-url: https://triptyche.cloud

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,loggers"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: triptyche-api

logging:
  level:
    root: info
    com.triptyche.backend: info
  file:
    path: /var/log/spring-boot/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: /var/log/spring-boot/application-%d{yyyy-MM-dd}-%i.log

trip:
  soft-delete:
    retention-days: 30

server:
  forward-headers-strategy: native
