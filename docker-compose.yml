# 디렉터리 마운트는 내용이 바뀌어도 compose가 감지하지 못한다. deploy.yml이 넘기는 설정 해시가 바뀌면 재생성된다.
x-monitoring-labels: &monitoring-labels
  triptyche.monitoring-config-hash: ${MONITORING_CONFIG_HASH:-}

services:
  app:
    container_name: triptyche-api
    image: maristadev/triptyche-api:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OCI_ACCESS_KEY: ${OCI_ACCESS_KEY}
      OCI_SECRET_KEY: ${OCI_SECRET_KEY}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      GUEST_JWT_SECRET: ${GUEST_JWT_SECRET}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      APP_MIN_SUPPORTED_VERSION: ${APP_MIN_SUPPORTED_VERSION:-1.0.0}
      APP_LATEST_VERSION: ${APP_LATEST_VERSION:-1.0.0}
      APP_UPDATE_URL: ${APP_UPDATE_URL:-https://triptyche.cloud}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-unknown}
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase.json:ro
    expose:
      - "8080"
      - "8081"
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: triptyche-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./database/config:/etc/mysql/conf.d
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  flyway:
    image: flyway/flyway:10
    container_name: triptyche-flyway
    depends_on:
      db:
        condition: service_healthy
    # MySQL 8 기본 인증(caching_sha2_password)은 평문 연결에서 서버 공개키가 필요하다.
    # db 컨테이너가 재시작되면 서버측 비밀번호 캐시가 비어 첫 인증이 이 지점에서 막힌다.
    # (실제로 이것 때문에 flyway가 실패했고, app이 의존하고 있어 API 전체가 내려갔다)
    command: -url=jdbc:mysql://db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true -user=${MYSQL_USER} -password=${MYSQL_PASSWORD} -connectRetries=5 migrate
    volumes:
      - ./database/migration:/flyway/sql
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: triptyche-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  image-worker:
    image: triptyche-image-worker
    build: ./image-worker
    container_name: triptyche-image-worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      OCI_ACCESS_KEY: ${OCI_ACCESS_KEY}
      OCI_SECRET_KEY: ${OCI_SECRET_KEY}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-unknown}
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: triptyche-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # 설정은 디렉터리로 마운트한다. 단일 파일 마운트는 scp 교체 후에도 옛 inode를 본다(nginx.conf에서 겪은 문제).
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: triptyche-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    environment:
      # 메모리 limit 안에서 GC가 먼저 동작하게 한다. 스왑이 없어 limit을 넘으면 곧바로 OOM kill이다.
      GOMEMLIMIT: 400MiB
    labels: *monitoring-labels
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:13.3.1
    container_name: triptyche-grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      # 비밀번호가 없으면 기본값(admin)으로 뜨지 않도록 기동 전에 실패시킨다.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?VM .env에 GF_SECURITY_ADMIN_PASSWORD가 필요하다}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # 기본 번들 플러그인(Drilldown 앱 등)을 기동 때마다 내려받아 메모리를 쓰지 않게 한다.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GOMEMLIMIT: 300MiB
      # 알림 프로비저닝 파일이 참조한다. 웹훅이 없어도 URL이 비지 않도록 더미를 둔다(알림 전송만 실패한다).
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.invalid/webhook-not-configured}
    labels: *monitoring-labels
    ports:
      # SSH 터널로만 접근한다: ssh -L 3001:localhost:3000 triptyche
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          # 256M로는 기동 중 OOM kill 된다(Grafana 13.3.1, VM에서 실측: 정상 상태 약 255MiB). 384M에서 안정적이다.
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # loki 이미지는 distroless라 셸이 없어 healthcheck를 둘 수 없다.
  loki:
    image: grafana/loki:3.7.9
    container_name: triptyche-loki
    command:
      - -config.file=/etc/loki/loki.yml
    environment:
      GOMEMLIMIT: 400MiB
    labels: *monitoring-labels
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # docker.sock을 Alloy에 직접 마운트하지 않는다. `:ro`는 소켓 파일의 쓰기만 막을 뿐
  # Docker API 호출은 막지 못하므로 사실상 root 권한이다. 이 프록시가 읽기 전용 엔드포인트만 통과시킨다.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: triptyche-docker-proxy
    environment:
      # 로그 수집에 필요한 GET만 허용한다. 나머지 엔드포인트는 이미지 기본값이 전부 0(차단)이다.
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
      EVENTS: 0
      VERSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docker-proxy-network

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: triptyche-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    depends_on:
      docker-proxy:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GOMEMLIMIT: 200MiB
    labels: *monitoring-labels
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      # 컨테이너별 읽은 위치를 보관한다. 없으면 재생성할 때 로그를 처음부터 다시 읽는다.
      - alloy_data:/var/lib/alloy/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      # alloy 이미지에는 curl/wget이 없다. bash의 /dev/tcp로 HTTP 포트가 열렸는지만 본다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
      - docker-proxy-network

networks:
  app-network:
    driver: bridge
  docker-proxy-network:
    internal: true

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
